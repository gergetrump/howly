services:
  backend:
    build: ./Backend
    container_name: howly-backend
    ports:
      - "3000:3000"

  frontend:
    build: ./Frontend
    container_name: howly-frontend
    environment:
      VITE_DEV_PROXY_TARGET: http://backend:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
