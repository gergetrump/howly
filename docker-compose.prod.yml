# Public deployment. The site proxies /api and /uploads to the API.
# Local development stays on docker-compose.yml.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - howly-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGO_URI: mongodb://mongo:27017/howly
      TRUST_PROXY: "1"
      SERVER_BASE_URL: ${PUBLIC_URL:-http://localhost:8080}
      FRONTEND_BASE_URL: ${PUBLIC_URL:-http://localhost:8080}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: http://backend:3000
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  howly-mongo:
