# Render Blueprint: private API plus the public site.
# Create it from the Render dashboard with New > Blueprint.
# MongoDB is Atlas (MONGO_URI). Keep the API at one instance so the streak job runs once.
services:
  - type: pserv
    name: howly-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    numInstances: 1
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: SERVER_BASE_URL
        fromService:
          name: howly
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_BASE_URL
        fromService:
          name: howly
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DISABLE_EMAIL_SENDING
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: howly
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /api/health
    numInstances: 1
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    envVars:
      - key: BACKEND_UPSTREAM
        fromService:
          name: howly-api
          type: pserv
          property: hostport
